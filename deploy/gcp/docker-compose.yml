# RoadSense demo on one VM: the app container behind Caddy, which gets a free Let's Encrypt certificate for
# SITE_HOST (an <ip>.sslip.io name by default). Written to /opt/roadsense by scripts/deploy_gcp.py with a .env beside it.
# Public: the web app, and GET /media/* of the agent API (signed evidence links a road authority opens), and the
# mock 311 inbox at 311.SITE_HOST (no sign-in: anyone with the link can mark a request repaired).
services:
  roadsense:
    build: .
    env_file: .env
    environment:
      ROADSENSE_OPEN311_INBOX_URL: https://311.${SITE_HOST}
      # the demo's 311 is the mock in this container: look for repairs every minute, so a request marked repaired
      # in the inbox shows as fixed in the app almost at once (a real city's feed keeps the 60-minute default)
      ROADSENSE_FOLLOW_UP_MINUTES: "1"
    expose: ["7860", "8000", "8311"]
    volumes:
      - roadsense-data:/app/data
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
  caddy:
    image: caddy:2.10
    environment:
      SITE_HOST: ${SITE_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [roadsense]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
volumes:
  roadsense-data:
  caddy-data:
  caddy-config:
